name: release

# Builds the macOS bundle and the .dmg on a real macOS runner — hdiutil only
# exists there, so this is the only honest place to produce a DMG.
#
#   git tag v1.3.2 && git push origin v1.3.2

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual build (no release is published)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PROJECT: src/LuaTools.App/LuaTools.App.csproj

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            label: arm64
          - rid: osx-x64
            label: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ -n "$VERSION" ]] || VERSION="0.0.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version: $VERSION"

      - name: Publish self-contained app
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT" \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishTrimmed=false -p:UseAppHost=true \
            -p:Version=${{ steps.v.outputs.version }} \
            -o "build/${{ matrix.rid }}"

      - name: Sign payload
        run: |
          set -uo pipefail
          DIR="build/${{ matrix.rid }}"
          LOG="sign.log"
          : > "$LOG"
          fail=0

          # Sign in the flat publish directory, before any .app exists. Inside a
          # bundle codesign treats Contents/MacOS as the code location and then
          # demands a signature for every one of the ~190 managed .dll files
          # sitting next to the apphost — which is not how .NET ships.
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              chmod 755 "$f"
              if codesign --force --sign - "$f" >>"$LOG" 2>&1; then
                echo "  signed  $(basename "$f")" | tee -a "$LOG"
              else
                echo "  FAILED  $(basename "$f")" | tee -a "$LOG"
                fail=1
              fi
            else
              chmod 644 "$f" 2>/dev/null || true
            fi
          done < <(find "$DIR" -type f -print0)

          if [[ $fail -ne 0 ]]; then
            echo "::group::sign.log"
            cat "$LOG"
            echo "::endgroup::"
            exit 1
          fi

      - name: Assemble bundle
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          VERSION="${{ steps.v.outputs.version }}"
          APP="build/LuaTools.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "build/$RID/." "$APP/Contents/MacOS/"
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>LuaTools</string>
            <key>CFBundleDisplayName</key>       <string>LuaTools</string>
            <key>CFBundleIdentifier</key>        <string>tools.lua.luatools</string>
            <key>CFBundleVersion</key>           <string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>CFBundleExecutable</key>        <string>LuaTools.App</string>
            <key>LSMinimumSystemVersion</key>    <string>11.0</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>LSApplicationCategoryType</key> <string>public.app-category.utilities</string>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"

      - name: Seal bundle (best effort)
        run: |
          set -uo pipefail
          APP="build/LuaTools.app"
          xattr -cr "$APP" 2>/dev/null || true

          if codesign --force --sign - "$APP" >>sign.log 2>&1; then
            echo "bundle seal: OK"
          else
            echo "::warning::bundle seal refused — every Mach-O is signed individually"
          fi

          codesign -dvv "$APP" 2>&1 | grep -E 'Format|CodeDirectory|Signature|Identifier' || true
          spctl --assess --type execute -vv "$APP" 2>&1 | head -3 || true

      - name: Verify bundle executes
        run: |
          set -uo pipefail
          APP="build/LuaTools.app"
          BIN="$APP/Contents/MacOS/LuaTools.App"
          RID="${{ matrix.rid }}"
          RUN=()

          echo "--- arch ---"
          lipo -archs "$BIN"
          file -b "$BIN"
          echo

          if [[ "$RID" == "osx-arm64" ]]; then
            RUN=("$BIN")
          elif arch -x86_64 /usr/bin/true 2>/dev/null; then
            RUN=(arch -x86_64 "$BIN")
          else
            echo "rosetta not installed — x64 selftest skipped (cross-built)"
            exit 0
          fi

          echo "--- selftest (headless: parser, filter, storage, live manifest) ---"
          "${RUN[@]}" --selftest
          echo

          echo "--- tool check (GitHub release asset, executed on this host) ---"
          "${RUN[@]}" --verify-tools
          echo

          # The GUI is the thing users actually open. Launch it, wait for the
          # window to report itself, then shut it down.
          echo "--- gui launch ---"
          "${RUN[@]}" > gui.log 2>&1 &
          PID=$!
          opened=0
          for _ in $(seq 1 45); do
            if grep -q LUATOOLS_WINDOW_OPENED gui.log 2>/dev/null; then opened=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          echo "gui output:"
          sed -e 's/^/    /' gui.log | head -40

          if [[ $opened -eq 1 ]]; then
            echo "GUI LAUNCH OK — Avalonia opened a window inside the bundle"
          else
            echo "::error::GUI did not open within 45s"
            exit 1
          fi

          if [[ -f "$HOME/Library/Application Support/LuaToolsMac/logs/luatools-$(date +%Y-%m-%d).log" ]]; then
            echo "--- app log ---"
            tail -5 "$HOME/Library/Application Support/LuaToolsMac/logs/luatools-$(date +%Y-%m-%d).log"
          fi

      - name: Build DMG
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          LABEL="${{ matrix.label }}"
          DMG="build/LuaTools-${VERSION}-${LABEL}.dmg"
          STAGE="build/dmg-stage"

          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "build/LuaTools.app" "$STAGE/LuaTools.app"
          ln -s /Applications "$STAGE/Applications"

          cat > "$STAGE/READ ME.txt" <<'NOTES'
          LuaTools for macOS
          ==================

          Install: drag LuaTools.app onto the Applications folder in this window.

          This build is ad-hoc signed, not notarized by Apple, so Gatekeeper will
          block the first launch. Use Terminal:

             xattr -dr com.apple.quarantine /Applications/LuaTools.app
             open /Applications/LuaTools.app

          Do not rely on System Settings -> Open Anyway for this build: the
          bundle signature is incomplete, so Gatekeeper may report it as
          damaged. The xattr command is tested by the release build.

          Requirements: macOS 11 or newer. The .NET runtime is bundled.

          The app downloads Steam depots. It does not install games into your
          Steam library and does not bypass DRM — see the project README.
          NOTES

          hdiutil create -volname "LuaTools" -srcfolder "$STAGE" \
            -ov -format UDZO -fs HFS+ "$DMG"
          hdiutil verify "$DMG"

          shasum -a 256 "$DMG" | tee "${DMG}.sha256"
          ls -lh "$DMG"

      - name: Verify DMG (the path a user actually takes)
        run: |
          set -uo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          LABEL="${{ matrix.label }}"
          RID="${{ matrix.rid }}"
          DMG="build/LuaTools-${VERSION}-${LABEL}.dmg"
          MNT="build/mnt"
          INSTALLED="build/LuaTools-installed/LuaTools.app"
          fail=0

          rm -rf "$MNT" build/LuaTools-installed
          mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -noautoopen -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT

          echo "--- volume layout ---"
          ls -la "$MNT"

          [[ -d "$MNT/LuaTools.app" ]] || { echo "::error::LuaTools.app missing from DMG"; fail=1; }
          [[ -L "$MNT/Applications" ]] || { echo "::error::Applications link missing"; fail=1; }
          [[ -f "$MNT/READ ME.txt" ]] || { echo "::error::READ ME.txt missing"; fail=1; }

          # Copy the way a user drags it, then simulate a browser download: the
          # DMG is built locally on CI, so it carries no quarantine attribute.
          ditto "$MNT/LuaTools.app" "$INSTALLED"
          Q="0081;$(printf '%x' "$(date +%s)");Safari;"
          xattr -w com.apple.quarantine "$Q" "$INSTALLED"

          echo "--- quarantine attribute ---"
          xattr -p com.apple.quarantine "$INSTALLED"

          echo "--- Gatekeeper assessment (ad-hoc => rejected; expected) ---"
          spctl --assess --type execute -vv "$INSTALLED" 2>&1 | head -5 || true

          # The documented install step has to be sufficient.
          xattr -dr com.apple.quarantine "$INSTALLED"

          RUN=()
          if [[ "$RID" == "osx-arm64" ]]; then
            RUN=("$INSTALLED/Contents/MacOS/LuaTools.App")
          elif arch -x86_64 /usr/bin/true 2>/dev/null; then
            RUN=(arch -x86_64 "$INSTALLED/Contents/MacOS/LuaTools.App")
          else
            echo "::warning::rosetta missing — x64 DMG launch not testable on this runner"
            hdiutil detach "$MNT" >/dev/null 2>&1 || true
            trap - EXIT
            exit 0
          fi

          echo "--- selftest from the copied app ---"
          "${RUN[@]}" --selftest
          [[ $? -eq 0 ]] || fail=1

          echo "--- window from the copied app ---"
          rm -rf "$HOME/Library/Application Support/LuaToolsMac/logs"
          "${RUN[@]}" > gui-dmg.log 2>&1 &
          PID=$!
          opened=0
          for _ in $(seq 1 45); do
            if grep -q LUATOOLS_WINDOW_OPENED gui-dmg.log 2>/dev/null; then opened=1; break; fi
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          sed -e 's/^/    /' gui-dmg.log | head -30
          if [[ $opened -eq 1 ]]; then
            echo "DMG APP LAUNCH OK"
          else
            echo "::error::app copied from the DMG did not open a window"
            fail=1
          fi

          hdiutil detach "$MNT" >/dev/null 2>&1 || true
          trap - EXIT

          [[ $fail -eq 0 ]] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: |
            build/LuaTools-*.dmg
            build/LuaTools-*.dmg.sha256
            gui.log
            gui-dmg.log
            sign.log
          if-no-files-found: error
          retention-days: 7

      # Job logs need repository admin to read, so a failure publishes its own
      # diagnostics to a throwaway branch where anyone (including the author)
      # can read them.
      - name: Publish failure log
        if: failure()
        run: |
          set -uo pipefail
          {
            echo "run:  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "rid:  ${{ matrix.rid }}"
            echo "--- sign.log ---"
            cat sign.log 2>/dev/null || echo "(no sign.log written)"
          } > ci-log.txt

          git config user.name "luatools-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-log.txt
          git commit -q -m "ci: ${{ matrix.rid }} failure ($GITHUB_RUN_ID)" || true
          git push -f origin ci-log || echo "could not publish log branch"

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -euo pipefail
          cd artifacts
          ls -lh build
          shopt -s nullglob
          dmgs=(build/*.dmg)
          [[ ${#dmgs[@]} -eq 2 ]] || { echo "expected 2 DMGs, found ${#dmgs[@]}"; exit 1; }
          : > SHA256SUMS.txt
          for f in "${dmgs[@]}"; do
            sha256sum "$f" | sed 's#  build/#  #' >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

          cat > ../NOTES.md <<'EOF'
          macOS build of LuaTools, produced on a real macOS runner.

          ## Install

          1. Download the `.dmg` for your machine: `arm64` (Apple Silicon) or `x64` (Intel).
          2. Open it and drag **LuaTools.app** onto **Applications**.
          3. First launch is blocked by Gatekeeper because the build is ad-hoc signed,
             not notarized by Apple. Clear the quarantine flag once:

          ```sh
          xattr -dr com.apple.quarantine /Applications/LuaTools.app
          open /Applications/LuaTools.app
          ```

             Use this command, not "Open Anyway": the bundle signature is
             incomplete, so Gatekeeper may report the app as damaged.

          ## What this build does

          - Steam discovery, library and `appmanifest_*.acf` parsing
          - Steam app/depot metadata, macOS depot detection via `config.oslist`
          - DepotDownloader acquisition (self-contained macOS release) and download
            with live progress
          - `luabuilds_*.lua` read/write

          ## What it does not do

          - No Steam account login. Downloads are anonymous only; Steam refuses
            paid games and free games that require ownership.
          - No Steam client injection (the `inject/` harness is research, not a feature)
          - No DRM removal — Steamless is PE-only and does not apply to macOS
          - A depot download is not a Steam install; games will not appear in your
            Steam library

          Every build is ad-hoc signed and verified on a macOS runner. The arm64
          build runs `--selftest` and `--verify-tools`, then mounts the finished
          DMG, copies the app, sets a quarantine attribute, clears it with the
          command above, and proves the copied app opens a window.
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          shopt -s nullglob
          assets=(artifacts/build/*.dmg artifacts/SHA256SUMS.txt HANDOFF.md docs/steam-macos-analysis.md)
          [[ ${#assets[@]} -eq 5 ]] || { echo "expected 2 DMGs + SHA256SUMS + 2 docs, found ${#assets[@]}"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LuaTools $TAG (macOS)" \
              --notes-file NOTES.md \
              --latest
          fi
